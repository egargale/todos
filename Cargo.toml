[package]
name = "todos"
version = "0.1.0"
edition = "2021"
description = "Find TODO-style markers in source comments, not in strings"
license = "MIT"

[[bin]]
name = "todos"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `serde_json` doubles as a dev-dependency so the process-level tests in
# `tests/check_json.rs` can assert on the parsed array rather than on a string.
[dev-dependencies]
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
